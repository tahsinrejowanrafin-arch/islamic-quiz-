<script>
/* প্রশ্ন: [প্রশ্ন, [ক, খ, গ, ঘ], সঠিক অপশনের নম্বর (০ = ক, ১ = খ, ২ = গ, ৩ = ঘ)] */
const CH2=[
["মহানবি (স) কোন বংশে জন্মগ্রহণ করেন?",["কায়েস","বনু বকর","কুরাইশ","হাওয়াজিন"],2],
["'কুরাইশ' শব্দের অর্থ কী?",["সত্যবাদী","বণিক","সাহায্যকারী","স্বর্ণকার"],1],
["মহানবি (স) কত খ্রিষ্টাব্দে জন্মগ্রহণ করেন?",["৫৬০","৫৬৫","৫৭০","৫৭৫"],2],
["মহানবি (স)-এর ধাত্রী মা কে ছিলেন?",["আমিনা","উম্মে আয়মান","যাকিয়া","হালিমা"],3],
["মহানবি হযরত মুহাম্মদ (স)-কে 'আল আমিন' বলা হয়, কারণ তিনি—",["আমানত রক্ষা করতেন ও সর্বদা সত্য কথা বলতেন","কর্তব্যনিষ্ঠায় অটুট ছিলেন","সৎ রাজনীতিক ও ধর্মীয় নেতা ছিলেন","অত্যন্ত বিচক্ষণতার সাথে কাজ করতেন"],0],
["হাজরে আসওয়াদ কী?",["মসজিদ","কালো পাথর","মিনার","কাবাঘর"],1],
["'হিলফুল ফুজুল' অর্থ কী?",["শান্তিসংঘ","অন্যায় সমর","প্রশংসিত","ন্যায়সংঘ"],0],
["কোন গুহায় মহানবি (স)-এর কাছে ওহি নাজিল হয়?",["সাফা","হেরা","মারওয়া","সাওর"],1],
["রাসুল (স) কত বছর গোপনে ইসলাম প্রচার করেন?",["এক","দুই","তিন","চার"],2],
["মুসলমানদের আবিসিনিয়ায় হিজরতের সময় সেখানকার রাজা কে ছিলেন?",["আবরাহা","নাজ্জাসি","খসরু","গাস্সানি"],1],
["মহানবি (স)-এর মদিনায় হিজরতের মূল কারণ কী ছিল?",["মক্কায় কুরাইশদের নির্মমতা","মদিনা ইসলামের অনুকূলে","মদিনায় সুন্দর জীবন","মদিনার সমৃদ্ধতা"],0],
["মদিনায় হিজরতকারীদের ইসলামের ইতিহাসে কী নামে ডাকা হয়?",["আনসার","মুহাজির","হানিফ","মাওয়ালি"],1],
["বদরের যুদ্ধে কতজন মুসলিম সৈন্য শাহাদাতবরণ করেন?",["১৪ জন","১৫ জন","২০ জন","৭০ জন"],0],
["ঐতিহাসিক হুদায়বিয়ার সন্ধি কাদের সাথে স্বাক্ষরিত হয়?",["কুরাইশদের","ইহুদিদের","খ্রিষ্টানদের","হিন্দুদের"],0],
["পবিত্র কুরআনে 'ফাতহুম মুবিন' বলা হয়েছে কোনটিকে?",["হুদায়বিয়ার সন্ধিকে","হিলফুল ফুজুলকে","মক্কা বিজয়কে","মদিনা বিজয়কে"],0],
["কত হিজরিতে মক্কা বিজয় হয়?",["ষষ্ঠ","সপ্তম","অষ্টম","দশম"],2],
["বিদায় হজ কত খ্রিষ্টাব্দে অনুষ্ঠিত হয়?",["৬৩০","৬৩২","৬৩৩","৬৩৪"],1],
["মহানবি (স) কোথায় বিদায় হজের ভাষণ দেন?",["কাবা চত্বরে","মিনায়","সাফা পর্বতে","আরাফাতে"],3],
["মহানবি (স) কত খ্রিষ্টাব্দে মৃত্যুবরণ করেন?",["৬৩০","৬৩২","৬৩৩","৬৩৪"],1],
["হিলফুল ফুজুলের উদ্দেশ্য ছিল—\ni. শান্তি-শৃঙ্খলা প্রতিষ্ঠা করা\nii. ইসলাম প্রতিষ্ঠা করা\niii. নিঃস্ব, অসহায় ও দুর্গতদের সেবা করা\nনিচের কোনটি সঠিক?",["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],1],
["মক্কা বিজয়ের ফলে—\ni. পৌত্তলিকতার অবসান হয়\nii. একেশ্বরবাদ প্রতিষ্ঠা হয়\niii. মিথ্যার ওপর সত্যের বিজয় হয়\nনিচের কোনটি সঠিক?",["i ও ii","i ও iii","ii ও iii","i, ii ও iii"],3],
["'হারবুল ফিজার' শব্দের অর্থ কী?",["ন্যায় সমর","কুরাইশদের যুদ্ধ","অন্যায় সমর","গোত্রীয় যুদ্ধ"],2],
["'হিলফুল ফুজুল' গঠনের মূল উদ্দেশ্য কী ছিল?",["শান্তি প্রতিষ্ঠা","ক্ষমতা দখল","নিজেদের প্রচার","যুবকদের সংগঠিত করা"],0],
["হিলফুল ফুজুল গঠনের মাধ্যমে হযরত মুহাম্মদ (স)-এর মূলত কোন গুণটির প্রকাশ ঘটেছে?",["সাহসিকতা","নেতৃত্বগুণ","মানবিকতা","গোত্রপ্রীতি"],1],
["হযরত মুহাম্মদ (স) কত খ্রিষ্টাব্দে নবুয়ত প্রাপ্ত হন?",["৫৭০ খ্রি.","৫৯৫ খ্রি.","৬১০ খ্রি.","৬২২ খ্রি."],2],
["সর্বপ্রথম লিখিত সংবিধান কোনটি?",["মদিনা সনদ","ব্রিটেন আইন","আমেরিকান আইন","ফ্রান্সের আইন"],0],
["মুসলমানদের প্রথম যুদ্ধ কোনটি?",["উহুদের যুদ্ধ","খন্দকের যুদ্ধ","বদরের যুদ্ধ","মুতার যুদ্ধ"],2],
["বদর যুদ্ধ কত খ্রিষ্টাব্দে সংঘটিত হয়?",["৬২২","৬২৪","৬২৫","৬২৭"],1],
["কে মহানবি (স)-কে পরিখা খনন করতে পরামর্শ দেন?",["আমর বিন আস (রা)","খালিদ বিন ওয়ালিদ (রা)","হামজা (রা)","সালমান ফারসি (রা)"],3],
["মহানবি (স) কত খ্রিষ্টাব্দে মক্কা বিজয় করেন?",["৬২৯","৬৩০","৬৩১","৬৩২"],1],
["মহানবি (স) কোন পাহাড়ে দাঁড়িয়ে বিদায় হজের ভাষণ দেন?",["জাবালে নূর","মারওয়া","সাফা","জাবালে রহমত"],3],
["মদিনা সনদের মাধ্যমে মুসলিমরা অর্জন করেছিল তাদের—\ni. ধর্মীয় স্বাধীনতা\nii. সামাজিক অধিকার\niii. অর্থনৈতিক সমৃদ্ধি\nনিচের কোনটি সঠিক?",["i ও ii","ii ও iii","i ও iii","i, ii ও iii"],0]
];
/* নতুন অধ্যায় যোগ করতে এখানে আরেকটি { name, sub, qs } যোগ করলেই হবে */
const CH=[{name:"দ্বিতীয় অধ্যায়",sub:"হযরত মুহাম্মদ (স)",qs:CH2}];

const T=30,KEY="ihq-v1",$=id=>document.getElementById(id);
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const L="কখগঘ";
let S=null,tm=null;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}}
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function view(id){["home","quiz","result"].forEach(s=>$(s).hidden=s!==id);clearTimeout(tm);window.scrollTo(0,0)}
const QS=()=>CH[S.c].qs;

function home(){
  $("chs").innerHTML="";
  CH.forEach((c,i)=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML="<h2></h2><p class='m'></p>";
    d.querySelector("h2").textContent=c.name+" — "+c.sub;
    const pp=d.querySelector("p");pp.className="pills";pp.innerHTML="<span class='pill'><b>"+bn(c.qs.length)+"</b>টি প্রশ্ন</span><span class='pill'>প্রতি প্রশ্নে <b>"+bn(T)+"</b> সেকেন্ড</span><span class='pill'>MCQ কুইজ</span>";
    const b=document.createElement("button");b.className="btn";b.textContent="কুইজ শুরু করো";
    b.onclick=()=>start(i);d.appendChild(b);$("chs").appendChild(d);
  });
  view("home");
}

function start(c){
  const qs=CH[c].qs,sq=$("sq").checked,so=$("so").checked;
  const ord=(sq?sh:a=>a)(qs.map((_,i)=>i));
  /* i, ii, iii ধরনের অপশন সাজানো থাকে, তাই সেগুলো এলোমেলো করা হয় না */
  const perm=ord.map(q=>so&&!/^i/.test(qs[q][1][0])?sh([0,1,2,3]):[0,1,2,3]);
  S={c,ord,perm,i:0,ans:ord.map(()=>null),done:false,end:Date.now()+T*1000};
  save();render();
}

function render(){
  view("quiz");
  const qs=QS(),n=S.ord.length,q=qs[S.ord[S.i]],p=S.perm[S.i],a=S.ans[S.i],c=p.indexOf(q[2]);
  $("cnt").textContent="প্রশ্ন "+bn(S.i+1)+" / "+bn(n);
  $("bar").style.width=(S.i/n*100)+"%";
  $("stem").textContent=q[0];
  const box=$("opts");box.innerHTML="";
  p.forEach((o,k)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML="<b>"+L[k]+"</b><span></span>";b.lastChild.textContent=q[1][o];
    if(a!==null){b.disabled=true;if(k===c)b.className+=" ok";else if(k===a)b.className+=" no"}
    b.onclick=()=>pick(k);box.appendChild(b);
  });
  const fb=$("fb"),nx=$("next");
  fb.hidden=nx.hidden=a===null;
  if(a!==null){
    const right="সঠিক উত্তর: "+L[c]+") "+q[1][q[2]];
    fb.className="fb "+(a===c?"ok":"no");
    fb.textContent=a===-1?"⏰ সময় শেষ! "+right:a===c?"✅ সঠিক উত্তর!":"❌ ভুল উত্তর। "+right;
    nx.textContent=S.i+1<n?"পরবর্তী প্রশ্ন":"ফলাফল দেখো";
    $("sec").textContent=a===-1?"০":"–";$("tbar").style.width="0%";
    $("timer").classList.remove("low");
  }
  tick();
}

function tick(){
  clearTimeout(tm);
  if(!S||S.done||S.ans[S.i]!==null)return;
  const ms=S.end-Date.now(),left=Math.max(0,Math.ceil(ms/1000));
  $("sec").textContent=bn(left);
  $("tbar").style.width=Math.max(0,ms/(T*10))+"%";
  $("timer").classList.toggle("low",left<=10);
  if(ms<=0){S.ans[S.i]=-1;save();render();return}
  tm=setTimeout(tick,200);
}

function pick(k){if(S.ans[S.i]!==null)return;S.ans[S.i]=k;save();render()}

function next(){
  if(S.i+1>=S.ord.length){S.done=true;save();result();return}
  S.i++;S.end=Date.now()+T*1000;save();render();
}

function result(){
  view("result");
  const n=S.ord.length;let ok=0,no=0,un=0;
  S.ans.forEach((a,i)=>{
    const q=QS()[S.ord[i]],c=S.perm[i].indexOf(q[2]);
    if(a===null||a===-1)un++;else if(a===c)ok++;else no++;
  });
  const p=Math.round(ok/n*100);
  $("ring").style.setProperty("--p",p);
  $("pct").textContent=bn(p)+"%";
  $("trophy").textContent=p>=80?"🏆":p>=60?"🎉":p>=40?"📖":"💪";
  $("msg").textContent=p>=80?"চমৎকার! দারুণ প্রস্তুতি।":p>=60?"ভালো হয়েছে। আরেকটু অনুশীলন করো।":p>=40?"আরও কিছুটা অনুশীলন দরকার।":"আবার চেষ্টা করো, পারবে।";
  const row=(t,v,cl)=>"<div class='"+(cl||"")+"'>"+t+"<b>"+v+"</b></div>";
  $("stats").innerHTML=row("মোট প্রশ্ন",bn(n))+row("সঠিক উত্তর",bn(ok),"g")+row("ভুল উত্তর",bn(no),"r")
    +row("উত্তর না দেওয়া",bn(un))+row("মোট প্রাপ্ত নম্বর",bn(ok)+" / "+bn(n))+row("সাফল্যের হার",bn(p)+"%");
}

$("next").onclick=next;
$("again").onclick=()=>start(S.c);
$("gohome").onclick=()=>{S=null;wipe();home()};
$("exit").onclick=()=>{S=null;wipe();home()};

S=load();
if(S&&S.ord&&CH[S.c]&&S.ord.length===CH[S.c].qs.length){S.done?result():render()}else{S=null;home()}
</script>
</body>
</html>
